trigger:
  batch: true
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-24.04

jobs:
  - job: MavenBuild
    displayName: Maven build (Java 25)
    timeoutInMinutes: 15
    steps:
      - checkout: self

      - task: JavaToolInstaller@0
        displayName: Select JDK 25
        inputs:
          versionSpec: '25'
          jdkArchitectureOption: x64
          jdkSourceOption: PreInstalled

      - bash: |
          set -euo pipefail
          java -version
          sh ./mvnw --version
          sh ./mvnw --batch-mode --no-transfer-progress clean package
        displayName: Test and package executable JAR

      - task: PublishTestResults@2
        displayName: Publish JUnit test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: '**/surefire-reports/TEST-*.xml'
          searchFolder: '$(System.DefaultWorkingDirectory)'
          mergeTestResults: true
          failTaskOnFailedTests: true
          failTaskOnFailureToPublishResults: true
          failTaskOnMissingResultsFile: true
          testRunTitle: Maven tests (Java 25)

      - task: PublishPipelineArtifact@1
        displayName: Upload executable JAR
        inputs:
          targetPath: '$(Build.SourcesDirectory)/target/todo-0.0.1-SNAPSHOT.jar'
          artifact: todo-app
          publishLocation: pipeline
