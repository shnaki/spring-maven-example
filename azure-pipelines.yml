trigger:
  batch: true
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-24.04

jobs:
  - job: MavenBuild
    displayName: Maven build (Java 25)
    timeoutInMinutes: 15
    steps:
      - checkout: self

      - task: JavaToolInstaller@0
        displayName: Select JDK 25
        inputs:
          versionSpec: '25'
          jdkArchitectureOption: x64
          jdkSourceOption: PreInstalled

      - bash: |
          set -euo pipefail
          java -version
          sh ./mvnw --version
          sh ./mvnw --batch-mode --no-transfer-progress clean package
        displayName: Test and package executable JAR

      - task: PublishTestResults@2
        displayName: Publish JUnit test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: '**/surefire-reports/TEST-*.xml'
          searchFolder: '$(System.DefaultWorkingDirectory)'
          mergeTestResults: true
          failTaskOnFailedTests: true
          failTaskOnFailureToPublishResults: true
          failTaskOnMissingResultsFile: true
          testRunTitle: Maven tests (Java 25)

      - task: CopyFiles@2
        displayName: Stage executable JAR for publishing
        inputs:
          SourceFolder: '$(Build.SourcesDirectory)/target'
          Contents: 'todo-0.0.1-SNAPSHOT.jar'
          TargetFolder: '$(Build.ArtifactStagingDirectory)/todo-app'

      - task: UniversalPackages@0
        displayName: Publish executable JAR to Azure Artifacts
        inputs:
          command: publish
          publishDirectory: '$(Build.ArtifactStagingDirectory)/todo-app'
          feedsToUsePublish: internal
          vstsFeedPublish: 'spring-maven-example/java-executable'
          vstsFeedPackagePublish: todo-app
          versionOption: custom
          versionPublish: '1.0.$(Build.BuildId)'
          packagePublishDescription: 'Executable Spring Boot JAR built by Azure Pipelines'
